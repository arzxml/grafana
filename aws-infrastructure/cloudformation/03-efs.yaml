AWSTemplateFormatVersion: '2010-09-09'
Description: 'EFS for Garmin Connect Token Storage'

Parameters:
  Environment:
    Type: String
    Default: production
    Description: Environment name

Resources:
  EFSFileSystem:
    Type: AWS::EFS::FileSystem
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      ThroughputMode: bursting
      BackupPolicy:
        Status: ENABLED
      LifecyclePolicies:
        - TransitionToIA: AFTER_30_DAYS
      FileSystemTags:
        - Key: Name
          Value: !Sub '${Environment}-garmin-tokens-efs'
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: GarminDataExporter

  MountTarget1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId:
        Fn::ImportValue: !Sub '${Environment}-PrivateSubnet1'
      SecurityGroups:
        - Fn::ImportValue: !Sub '${Environment}-EFSSecurityGroup'

  MountTarget2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref EFSFileSystem
      SubnetId:
        Fn::ImportValue: !Sub '${Environment}-PrivateSubnet2'
      SecurityGroups:
        - Fn::ImportValue: !Sub '${Environment}-EFSSecurityGroup'

  # Access Point for ECS tasks
  EFSAccessPoint:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref EFSFileSystem
      PosixUser:
        Uid: '1000'
        Gid: '1000'
      RootDirectory:
        CreationInfo:
          OwnerGid: '1000'
          OwnerUid: '1000'
          Permissions: '755'
        Path: '/garmin-tokens'
      AccessPointTags:
        - Key: Name
          Value: !Sub '${Environment}-garmin-tokens-access-point'

Outputs:
  FileSystemId:
    Description: EFS File System ID
    Value: !Ref EFSFileSystem
    Export:
      Name: !Sub '${Environment}-EFSFileSystemId'

  AccessPointId:
    Description: EFS Access Point ID
    Value: !Ref EFSAccessPoint
    Export:
      Name: !Sub '${Environment}-EFSAccessPointId'

  AccessPointArn:
    Description: EFS Access Point ARN
    Value: !GetAtt EFSAccessPoint.Arn
    Export:
      Name: !Sub '${Environment}-EFSAccessPointArn'
