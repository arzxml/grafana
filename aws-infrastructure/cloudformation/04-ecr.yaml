AWSTemplateFormatVersion: '2010-09-09'
Description: 'ECR Repositories for Garmin Data Exporter'

Resources:
  GarminDataExporterRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: garmin-data-exporter
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep last 10 images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 10
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Name
          Value: garmin-data-exporter
        - Key: Application
          Value: GarminDataExporter

Outputs:
  RepositoryUri:
    Description: ECR Repository URI for Garmin Data Exporter
    Value: !GetAtt GarminDataExporterRepository.RepositoryUri
    Export:
      Name: GarminDataExporterRepositoryUri

  RepositoryArn:
    Description: ECR Repository ARN
    Value: !GetAtt GarminDataExporterRepository.Arn
    Export:
      Name: GarminDataExporterRepositoryArn
