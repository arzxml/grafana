AWSTemplateFormatVersion: '2010-09-09'
Description: 'ECS Cluster and Service for Garmin Data Exporter'

Parameters:
  Environment:
    Type: String
    Default: production
    Description: Environment name

  ImageUri:
    Type: String
    Description: Docker image URI from ECR

  TaskCpu:
    Type: String
    Default: '256'
    AllowedValues: ['256', '512', '1024', '2048', '4096']
    Description: Task CPU units (256 = 0.25 vCPU)

  TaskMemory:
    Type: String
    Default: '512'
    AllowedValues: ['512', '1024', '2048', '4096', '8192']
    Description: Task memory in MB

Resources:
  # CloudWatch Log Group
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/garmin-data-exporter
      RetentionInDays: 30

  # ECS Cluster
  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub '${Environment}-garmin-exporter-cluster'
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-garmin-exporter-cluster'
        - Key: Environment
          Value: !Ref Environment

  # ECS Task Execution Role (for pulling images, logging)
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-garmin-exporter-execution-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:garmin-exporter/*'
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-garmin-exporter-execution-role'

  # ECS Task Role (for application permissions)
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${Environment}-garmin-exporter-task-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: TimestreamWriteAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - timestream:WriteRecords
                  - timestream:DescribeEndpoints
                Resource: '*'
              - Effect: Allow
                Action:
                  - timestream:DescribeDatabase
                  - timestream:DescribeTable
                Resource:
                  - Fn::ImportValue: TimestreamDatabaseArn
        - PolicyName: SecretsManagerAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:garmin-exporter/*'
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt LogGroup.Arn
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-garmin-exporter-task-role'

  # ECS Task Definition
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub '${Environment}-garmin-data-exporter'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: garmin-data-exporter
          Image: !Ref ImageUri
          Essential: true
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: ecs
          Environment:
            - Name: TIMESTREAM_DATABASE
              Value:
                Fn::ImportValue: TimestreamDatabaseName
            - Name: TIMESTREAM_TABLE
              Value:
                Fn::ImportValue: TimestreamTableName
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: LOG_LEVEL
              Value: INFO
            - Name: UPDATE_INTERVAL_SECONDS
              Value: '300'
            - Name: FETCH_SELECTION
              Value: daily_avg,sleep,steps,heartrate,stress,breathing,hrv,vo2,activity,race_prediction,body_composition
          Secrets:
            - Name: GARMINCONNECT_EMAIL
              ValueFrom: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:garmin-exporter/garmin-credentials:GARMINCONNECT_EMAIL::'
            - Name: GARMINCONNECT_BASE64_PASSWORD
              ValueFrom: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:garmin-exporter/garmin-credentials:GARMINCONNECT_BASE64_PASSWORD::'
          MountPoints:
            - SourceVolume: garmin-tokens
              ContainerPath: /home/appuser/.garminconnect
              ReadOnly: false
      Volumes:
        - Name: garmin-tokens
          EFSVolumeConfiguration:
            FilesystemId:
              Fn::ImportValue: !Sub '${Environment}-EFSFileSystemId'
            TransitEncryption: ENABLED
            AuthorizationConfig:
              AccessPointId:
                Fn::ImportValue: !Sub '${Environment}-EFSAccessPointId'
              IAM: ENABLED
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-garmin-data-exporter-task'

  # ECS Service
  ECSService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub '${Environment}-garmin-data-exporter'
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets:
            - Fn::ImportValue: !Sub '${Environment}-PrivateSubnet1'
            - Fn::ImportValue: !Sub '${Environment}-PrivateSubnet2'
          SecurityGroups:
            - Fn::ImportValue: !Sub '${Environment}-ECSTaskSecurityGroup'
      Tags:
        - Key: Name
          Value: !Sub '${Environment}-garmin-data-exporter-service'
        - Key: Environment
          Value: !Ref Environment

Outputs:
  ClusterName:
    Description: ECS Cluster Name
    Value: !Ref ECSCluster
    Export:
      Name: !Sub '${Environment}-ECSClusterName'

  ServiceName:
    Description: ECS Service Name
    Value: !GetAtt ECSService.Name
    Export:
      Name: !Sub '${Environment}-ECSServiceName'

  TaskDefinitionArn:
    Description: Task Definition ARN
    Value: !Ref TaskDefinition

  LogGroupName:
    Description: CloudWatch Log Group Name
    Value: !Ref LogGroup
