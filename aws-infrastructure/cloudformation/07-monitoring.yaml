AWSTemplateFormatVersion: '2010-09-09'
Description: 'CloudWatch Monitoring and Alarms for Garmin Data Exporter'

Parameters:
  Environment:
    Type: String
    Default: production
    Description: Environment name

  AlarmEmail:
    Type: String
    Description: Email address for alarm notifications
    Default: ''

Conditions:
  CreateEmailAlarm: !Not [!Equals [!Ref AlarmEmail, '']]

Resources:
  # SNS Topic for Alarms
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: CreateEmailAlarm
    Properties:
      TopicName: !Sub '${Environment}-garmin-exporter-alarms'
      DisplayName: Garmin Data Exporter Alarms
      Subscription:
        - Endpoint: !Ref AlarmEmail
          Protocol: email

  # CloudWatch Dashboard
  MonitoringDashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub '${Environment}-garmin-exporter-dashboard'
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/ECS", "CPUUtilization", {"stat": "Average"}]
                ],
                "period": 300,
                "stat": "Average",
                "region": "${AWS::Region}",
                "title": "ECS CPU Utilization",
                "yAxis": {
                  "left": {
                    "min": 0,
                    "max": 100
                  }
                }
              }
            },
            {
              "type": "metric",
              "properties": {
                "metrics": [
                  ["AWS/ECS", "MemoryUtilization", {"stat": "Average"}]
                ],
                "period": 300,
                "stat": "Average",
                "region": "${AWS::Region}",
                "title": "ECS Memory Utilization",
                "yAxis": {
                  "left": {
                    "min": 0,
                    "max": 100
                  }
                }
              }
            },
            {
              "type": "log",
              "properties": {
                "query": "SOURCE '/ecs/garmin-data-exporter'\n| fields @timestamp, @message\n| filter @message like /ERROR/\n| sort @timestamp desc\n| limit 20",
                "region": "${AWS::Region}",
                "title": "Recent Errors",
                "stacked": false
              }
            }
          ]
        }

  # Alarm: ECS Service Task Count
  TaskCountAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateEmailAlarm
    Properties:
      AlarmName: !Sub '${Environment}-garmin-exporter-task-count'
      AlarmDescription: Alert when ECS service has no running tasks
      MetricName: RunningTaskCount
      Namespace: ECS/ContainerInsights
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      Dimensions:
        - Name: ServiceName
          Value:
            Fn::ImportValue: !Sub '${Environment}-ECSServiceName'
        - Name: ClusterName
          Value:
            Fn::ImportValue: !Sub '${Environment}-ECSClusterName'
      AlarmActions:
        - !Ref AlarmTopic
      TreatMissingData: breaching

  # Alarm: High CPU Utilization
  HighCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateEmailAlarm
    Properties:
      AlarmName: !Sub '${Environment}-garmin-exporter-high-cpu'
      AlarmDescription: Alert when CPU utilization is high
      MetricName: CPUUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ServiceName
          Value:
            Fn::ImportValue: !Sub '${Environment}-ECSServiceName'
        - Name: ClusterName
          Value:
            Fn::ImportValue: !Sub '${Environment}-ECSClusterName'
      AlarmActions:
        - !Ref AlarmTopic

  # Alarm: High Memory Utilization
  HighMemoryAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateEmailAlarm
    Properties:
      AlarmName: !Sub '${Environment}-garmin-exporter-high-memory'
      AlarmDescription: Alert when memory utilization is high
      MetricName: MemoryUtilization
      Namespace: AWS/ECS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ServiceName
          Value:
            Fn::ImportValue: !Sub '${Environment}-ECSServiceName'
        - Name: ClusterName
          Value:
            Fn::ImportValue: !Sub '${Environment}-ECSClusterName'
      AlarmActions:
        - !Ref AlarmTopic

  # Log Metric Filter for Errors
  ErrorLogMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      FilterPattern: '[time, request_id, event_type = ERROR*, ...]'
      LogGroupName: /ecs/garmin-data-exporter
      MetricTransformations:
        - MetricName: ApplicationErrors
          MetricNamespace: GarminDataExporter
          MetricValue: '1'
          DefaultValue: 0

  # Alarm: Application Errors
  ApplicationErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateEmailAlarm
    Properties:
      AlarmName: !Sub '${Environment}-garmin-exporter-application-errors'
      AlarmDescription: Alert when application errors are detected
      MetricName: ApplicationErrors
      Namespace: GarminDataExporter
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      AlarmActions:
        - !Ref AlarmTopic
      TreatMissingData: notBreaching

Outputs:
  DashboardURL:
    Description: CloudWatch Dashboard URL
    Value: !Sub 'https://console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=${MonitoringDashboard}'

  AlarmTopicArn:
    Condition: CreateEmailAlarm
    Description: SNS Topic ARN for Alarms
    Value: !Ref AlarmTopic
